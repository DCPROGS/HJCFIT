# Continuous integration for HJCFIT.
#
# Replaces .github/workflows/probe-build.yml, which was a diagnostic that let
# every stage continue on error so one run could surface as many failures as
# possible. That job is done: the build and the full suite pass. This workflow
# is a gate — a failure here means something is broken and needs fixing.
#
# fail-fast is false, which is not the same as continue-on-error. A failing axis
# still fails the workflow; it just does not cancel the others, so one run tells
# you whether a break is specific to a platform or general.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Superseded runs on the same branch are pointless once a newer commit exists.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    # Git Bash is present on the Windows runners, so one set of build steps
    # serves all three platforms rather than a pwsh fork of each.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          # Reference configuration: the one proven green in run 33325106685.
          - name: linux-py312
            os: ubuntu-24.04
            python: '3.12'
          # Python floor and ceiling. 3.10 is the oldest that matters, since
          # collections.abc (F22) and inspect.getargspec (F24) rule out 3.9 and
          # below being interesting; 3.13 is the current release.
          - name: linux-py310
            os: ubuntu-24.04
            python: '3.10'
          - name: linux-py313
            os: ubuntu-24.04
            python: '3.13'
          # Older distribution: earlier GCC and CMake. Confirms the F2 fix is not
          # narrowly tied to GCC 13, and that we have not silently started
          # depending on a recent CMake.
          - name: linux-old
            os: ubuntu-22.04
            python: '3.11'
          # t_real becomes long double. A supported build option that changes the
          # numeric type throughout, and was a Travis axis.
          - name: long-double
            os: ubuntu-24.04
            python: '3.12'
            cmake_extra: -DHJCFIT_LONG_DOUBLE=ON
          # macOS, restored now that CookOff is gone. Every previous failure on this
          # axis was CookOff's, not HJCFIT's. Apple Clang needs libomp for OpenMP;
          # without it CMake reports no OpenMP support and continues, which is a
          # configuration worth exercising. macos-14 also ships CMake 4, so this is
          # the only axis covering it.
          - name: macos
            os: macos-14
            python: '3.12'
          # Windows has never been covered. The last build instructions for it
          # date from 2016 and name the old dcprogs paths, so treat any failure
          # here as unexplored rather than regressed. MPFR needs no attention:
          # CMAKE_DEPENDENT_OPTION already forces HJCFIT_USE_MPFR off when the
          # platform is not UNIX.
          - name: windows
            os: windows-2022
            python: '3.12'
            # Visual Studio rather than Ninja. With Ninja and no VS environment
            # activated, CMake picked C:/mingw64 and built a MinGW extension
            # that then could not find libgcc/libstdc++/libwinpthread at import
            # time. CPython on Windows is built with MSVC, so matching it avoids
            # mixing runtimes as well.
            generator: 'Visual Studio 17 2022'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential swig libeigen3-dev libgmp-dev libmpfr-dev \
            liblapack-dev gfortran ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install swig eigen gmp mpfr ninja libomp

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install --no-progress -y swig
          vcpkg install eigen3:x64-windows
          # find_package(Eigen3 CONFIG) reads CMAKE_PREFIX_PATH from the
          # environment, so pointing it at vcpkg's tree avoids threading a
          # toolchain file through the shared configure step.
          echo "CMAKE_PREFIX_PATH=$VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy behave

      - name: Record toolchain versions
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo
            echo "| Tool | Version |"
            echo "|---|---|"
            echo "| OS | ${{ matrix.os }} |"
            echo "| CMake | $(cmake --version | head -1 | awk '{print $3}') |"
            echo "| SWIG | $(swig -version | awk '/SWIG Version/{print $3}') |"
            echo "| Python | $(python -c 'import sys; print("%d.%d.%d" % sys.version_info[:3])') |"
            echo "| NumPy | $(python -c 'import numpy; print(numpy.__version__)') |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure
        run: |
          cmake -S . -B build -G "${{ matrix.generator || 'Ninja' }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -Dtests=ON \
            -DpythonBindings=ON \
            -DcompileDocs=OFF \
            -Dexecutenotebooks=OFF \
            -DHUNTER_ENABLED=OFF \
            ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --parallel --config Release

      # --timeout turns a hung test into a named "***Timeout" result rather than
      # a job that stalls until the runner limit. Every test finishes well under
      # 2s; 120 is generous.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120

      # Only on failure: a green run's logs are noise, and artifacts cost storage.
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.name }}
          path: |
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeCache.txt
            build/Testing/**/*.log
            build/_deps/**/*.log
          if-no-files-found: ignore
          retention-days: 14

  # read_idealized_bursts and log_bin_edges import dcio and scalcs at call time,
  # so the likelihood library needs nothing but numpy. The cost of that design is
  # that the matrix above, which installs neither, cannot exercise either entry
  # point -- both shipped with no coverage at all, and a green run said nothing
  # about them. This job installs both from git and runs the tests that do.
  #
  # It builds through scikit-build-core rather than the CMake matrix: pip install
  # gives an installed package, which is also what a user has.
  dcio-integration:
    name: dcio-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends             build-essential swig libeigen3-dev libgmp-dev libmpfr-dev             liblapack-dev gfortran ninja-build

      - name: Build and install HJCFIT
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Install the optional record layer
        run: |
          pip install dcio scalcs
          pip install pytest matplotlib
          pip list

      # Run from outside the source tree, so the installed package is what is
      # imported rather than the checkout.
      #
      # test_simplex.py rides along here rather than in the build matrix: it is
      # pure Python and needs no dcio, but it does need HJCFIT *installed*, and
      # this is the only job that installs it. The matrix runs ctest against
      # the build tree instead.
      - name: Tests
        env:
          MPLBACKEND: Agg
        run: |
          cp tests/test_dcio_integration.py tests/test_simplex.py /tmp/
          cd /tmp
          pytest test_dcio_integration.py test_simplex.py -v
