# Binary wheels.
#
# There has never been a way to install HJCFIT except to build it: no
# pyproject.toml, no wheels, no release in thirteen years. For an
# electrophysiology audience that is the wall, and it is the most likely reason a
# well-regarded method has single-figure stars.
#
# cibuildwheel drives scikit-build-core, which drives the existing CMake build.
# One build system throughout rather than a second description of the same thing
# that can drift.
#
# Built for CPython 3.10 through 3.13 on Linux, macOS arm64 and Windows x64,
# plus a source distribution, and published to PyPI when a v* tag is pushed.

name: Wheels

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: wheels-linux,   os: ubuntu-24.04 }
          - { name: wheels-macos,   os: macos-14 }
          - { name: wheels-windows, os: windows-2022 }

    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        env:
          # 3.10 is the floor: collections.abc (F22) and inspect.getargspec (F24)
          # make anything older a different piece of work, and numpy 2.1 requires
          # 3.10 anyway.
          CIBW_BUILD: cp310-* cp311-* cp312-* cp313-*
          CIBW_SKIP: "*-musllinux_* *_i686 *-win32"
          CIBW_ARCHS_MACOS: arm64

          # manylinux2014 carries GCC 10.2, and building numpy from source in
          # that image fails with "NumPy requires GCC >= 10.3". 2_28 is
          # AlmaLinux 8 with GCC 12.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28

          # SWIG and Eigen are needed to build; neither is in a manylinux image.
          # Eigen comes from source rather than a package, because the version
          # available differs per distribution and Eigen is header-only, so
          # installing it is a copy.
          CIBW_BEFORE_ALL_LINUX: >
            (yum install -y swig || dnf install -y swig) &&
            curl -sSL https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz -o eigen.tar.gz &&
            tar xf eigen.tar.gz &&
            cmake -S eigen-3.4.0 -B eigen-build -DCMAKE_INSTALL_PREFIX=/usr/local &&
            cmake --install eigen-build
          # No swig from Homebrew: it serves whatever is current, and 4.5.0
          # generates Python 2 C-API calls into the wrapper (#188). The pin is
          # in pyproject.toml's build-system requires, which puts swig in the
          # isolated build environment. Leaving Homebrew's out means nothing
          # can shadow the pinned one.
          #
          # Linux and Windows keep theirs as a fallback: they pass today, and
          # the build requirement applies to them too, so they gain the pin
          # without losing what already works.
          CIBW_BEFORE_ALL_MACOS: brew install eigen
          CIBW_BEFORE_ALL_WINDOWS: choco install --no-progress -y swig && vcpkg install eigen3:x64-windows

          # find_package(Eigen3 CONFIG) reads this from the environment.
          CIBW_ENVIRONMENT_WINDOWS: CMAKE_PREFIX_PATH='C:/vcpkg/installed/x64-windows'

          # Importing the package is the only test that matters here: it proves
          # the extension loads and finds the shared library beside it, which is
          # what every previous packaging attempt on Windows got wrong.
          CIBW_TEST_COMMAND: python -c "import HJCFIT.likelihood as L; print(L.QMatrix)"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: wheelhouse/*.whl
          retention-days: 14

  # A wheel exists for CPython 3.10-3.13 on three platforms. Everything else --
  # Linux aarch64, musl, a Python newer than the matrix, anyone who needs MPFR
  # -- builds from source or not at all, so the sdist is the difference between
  # a narrow release and one that degrades gracefully. It is also the archival
  # form: wheels are derived, this is what was published.
  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      # An sdist that cannot be built from is worse than no sdist, and nothing
      # about producing the tarball proves it. Install it the way a user on an
      # unsupported platform would.
      - name: Build and import from the sdist
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends             build-essential swig libeigen3-dev
          python -m venv /tmp/fromsdist
          /tmp/fromsdist/bin/pip install --upgrade pip
          /tmp/fromsdist/bin/pip install dist/*.tar.gz
          cd /tmp
          /tmp/fromsdist/bin/python -c "import HJCFIT.likelihood as L; print(L.QMatrix)"

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 14

  # Publishing happens only for a v* tag, and only through PyPI Trusted
  # Publishing: the repository holds no API token, and PyPI verifies the
  # workflow's OIDC identity instead. A version number cannot be reused once
  # uploaded, so this deliberately does not run on ordinary pushes.
  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04

    environment:
      name: pypi
      url: https://pypi.org/p/hjcfit

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # A tag that disagrees with the version it claims to publish names the
      # release one thing on GitHub and another on PyPI, and the number cannot
      # be taken back afterwards. SCALCS reached its first release with a tag
      # already used at an older commit; this is the check that would have
      # said so.
      - name: Tag matches the version
        run: |
          python - <<'PY'
          import os, pathlib, re
          proj = re.search(r'^version = "([^"]+)"',
                           pathlib.Path('pyproject.toml').read_text(), re.M).group(1)
          tag = os.environ['GITHUB_REF'].removeprefix('refs/tags/v')
          if proj != tag:
              raise SystemExit(f'tag v{tag} does not match version {proj}')
          print('tag and version agree:', proj)
          PY

      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist

      - name: What is about to be published
        run: ls -la dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
